name: Build and Publish Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Temurin Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          echo "JAVA_HOME: $JAVA_HOME"
          java -version
          JAVA_VER_STRING=$(java -version 2>&1 | awk -F '"' '/version/ {print $2}')
          if [ -z "$JAVA_VER_STRING" ]; then
            echo "Error: Unable to detect Java version from output."
            exit 1
          fi
          echo "Detected Java version string: $JAVA_VER_STRING"
          MAJOR_VERSION=$(echo "$JAVA_VER_STRING" | awk -F '.' '{if ($1 == "1") print $2; else print $1;}')
          if [ -z "$MAJOR_VERSION" ]; then
            echo "Error: Unable to parse Java major version."
            exit 1
          fi
          echo "Active Java major version: $MAJOR_VERSION"
          if [ "$MAJOR_VERSION" -lt 17 ]; then
            echo "Error: Java major version is $MAJOR_VERSION, which is lower than required version 17."
            exit 1
          fi
          echo "Java environment verified: Java $MAJOR_VERSION (>= 17) is active."

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          if [ -f "./debug.keystore" ]; then
            echo "./debug.keystore already exists."
          else
            echo "Generating temporary debug keystore..."
            "$JAVA_HOME/bin/keytool" -genkey -v \
              -keystore ./debug.keystore \
              -alias androiddebugkey \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass android \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          if [ ! -f "./debug.keystore" ]; then
            echo "Error: ./debug.keystore was not found and could not be created."
            exit 1
          fi
          echo "Debug keystore confirmed present."

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify debug APK
        run: |
          EXPECTED_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$EXPECTED_APK" ]; then
            echo "Error: Expected debug APK not found at $EXPECTED_APK"
            echo "Searching only inside app/build/outputs/apk for discovered APKs:"
            if [ -d "app/build/outputs/apk" ]; then
              find app/build/outputs/apk -maxdepth 3 -type f -name "*.apk"
            else
              echo "Directory app/build/outputs/apk does not exist."
            fi
            exit 1
          fi

          if [ ! -f "$EXPECTED_APK" ]; then
            echo "Error: $EXPECTED_APK is not a regular file."
            exit 1
          fi

          if [ ! -s "$EXPECTED_APK" ]; then
            echo "Error: $EXPECTED_APK is empty (0 bytes)."
            exit 1
          fi

          case "$EXPECTED_APK" in
            *.apk) ;;
            *) echo "Error: $EXPECTED_APK does not have the .apk extension."; exit 1 ;;
          esac

          if [ "$EXPECTED_APK" != "app/build/outputs/apk/debug/app-debug.apk" ]; then
            echo "Error: Selected APK path does not match app/build/outputs/apk/debug/app-debug.apk exactly."
            exit 1
          fi

          echo "APK verified successfully: $EXPECTED_APK"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          ASSET_DIR="${{ runner.temp }}/release_assets"
          mkdir -p "$ASSET_DIR"

          RAW_REPO_NAME="${{ github.repository }}"
          REPO_NAME=$(basename "$RAW_REPO_NAME" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9._-]/-/g' | sed 's/^-//;s/-$//')
          if [ -z "$REPO_NAME" ]; then
            REPO_NAME="android-app"
          fi

          RUN_NUM="${{ github.run_number }}"
          ASSET_NAME="${REPO_NAME}-debug-build-${RUN_NUM}.apk"
          DEST_PATH="${ASSET_DIR}/${ASSET_NAME}"

          cp app/build/outputs/apk/debug/app-debug.apk "$DEST_PATH"

          if [ ! -s "$DEST_PATH" ]; then
            echo "Error: Failed to copy or verify release asset at $DEST_PATH"
            exit 1
          fi

          echo "Prepared release asset: $DEST_PATH"
          echo "asset_path=$DEST_PATH" >> "$GITHUB_OUTPUT"
          echo "asset_name=$ASSET_NAME" >> "$GITHUB_OUTPUT"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Checking GitHub CLI availability..."
          gh --version

          ASSET_PATH="${{ steps.prepare_asset.outputs.asset_path }}"
          if [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ]; then
            echo "Error: Release asset $ASSET_PATH does not exist or is empty. Aborting release creation."
            exit 1
          fi

          case "$ASSET_PATH" in
            *.apk) ;;
            *) echo "Error: Release asset is not an .apk file. Aborting."; exit 1 ;;
          esac

          RELEASE_TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          RELEASE_TITLE="Debug APK Build #${{ github.run_number }}"
          TARGET_COMMIT="${{ github.sha }}"

          echo "Creating GitHub Release with tag: $RELEASE_TAG and target: $TARGET_COMMIT"

          gh release create "$RELEASE_TAG" "$ASSET_PATH" \
            --target "$TARGET_COMMIT" \
            --title "$RELEASE_TITLE" \
            --notes "### Debug APK Build Details

- **Type**: Automatically generated debug APK
- **Builder**: GitHub Actions
- **Run Number**: #${{ github.run_number }}
- **Run Attempt**: ${{ github.run_attempt }}
- **Source Commit**: \`${TARGET_COMMIT}\`
- **Purpose**: This APK is intended for testing and development preview.
- **Production Status**: This is NOT a Google Play Store production release.
- **Signing**: Signed exclusively with a temporary debug keystore." \
            --latest

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          RELEASE_STATUS="${{ steps.publish_release.outcome }}"

          if [ "$RELEASE_STATUS" = "success" ]; then
            echo "GitHub Release published successfully."
            gh release view "$RELEASE_TAG"
            RELEASE_URL=$(gh release view "$RELEASE_TAG" --json url -q .url 2>/dev/null || echo "https://github.com/${{ github.repository }}/releases/tag/${RELEASE_TAG}")
            RELEASE_TITLE="Debug APK Build #${{ github.run_number }}"
            ASSET_NAME="${{ steps.prepare_asset.outputs.asset_name }}"

            echo "---------------------------------------------------------"
            echo "Release Tag: $RELEASE_TAG"
            echo "Release Title: $RELEASE_TITLE"
            echo "Release Page URL: $RELEASE_URL"
            echo "APK Asset Filename: $ASSET_NAME"
            echo "---------------------------------------------------------"

            {
              echo "## 🚀 Debug APK Build & Release Summary"
              echo ""
              echo "### ✅ Release Published Successfully"
              echo "- **Release Title**: $RELEASE_TITLE"
              echo "- **Release Tag**: \`$RELEASE_TAG\`"
              echo "- **APK Filename**: \`$ASSET_NAME\`"
              echo "- **Direct Release Page**: [View GitHub Release]($RELEASE_URL)"
              echo ""
              echo "You can download the APK file directly from the **Assets** section of the release page on your Android device."
              echo ""
              echo "> **Backup**: The standard GitHub Actions artifact named \`app-debug-apk\` is also available in the run summary."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::GitHub Release publishing was not completed or failed."
            echo "The debug APK was built successfully and uploaded as an Actions artifact."
            echo "Actions artifact 'app-debug-apk' remains intact and available for download."

            {
              echo "## ⚠️ Debug APK Build Summary"
              echo ""
              echo "### ✅ APK Build Succeeded"
              echo "- The debug APK built successfully."
              echo "- The GitHub Actions artifact named **\`app-debug-apk\`** is available for download directly from this workflow run."
              echo ""
              echo "### ⚠️ Release Publishing Notice"
              echo "GitHub Release publishing did not complete (or release permissions were not available). The build result is not lost — please download the APK from the **Artifacts** section of this workflow run."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
